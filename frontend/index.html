<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="NGX market data, technical analysis and news for Nigerian investors. Educational information, not investment advice."
    />
    <title>EquityLensNG</title>
    <!-- Link previews (US-1.1). og:image must become an absolute URL once the domain is set (PENDING-ACTIONS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EquityLensNG" />
    <meta property="og:title" content="EquityLensNG: see the Nigerian market clearly" />
    <meta property="og:description" content="Prices, charts and news for every NGX stock, in plain language." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The hero's fonts, fetched with the code so the headline doesn't reflow (and shift the page)
         when they swap in. Plex Sans' latin-ext subset holds ₦ (U+20A6), on almost every screen.
         The other weights load on demand. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-ext-400-normal.woff2"
    />
    <!-- Applies the saved theme before first paint (no flash). Inline so it doesn't block the first
         paint on a request; the backend's CSP allows it by its hash (docs/12 §6). "system" (or
         nothing saved) leaves data-theme unset, so tokens.css follows the OS (docs/06 §2, US-6.2). -->
    <script>
      try {
        var t = localStorage.getItem("el-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <!-- Starts the first requests while the app's code downloads (P3 criterion 3): the screen's
         own code (the build fills in ROUTE_CHUNKS, vite.config.ts), the session check and, on
         Market Today, its data (the private parts once signed in). Each response is used once by
         src/api/client.ts; the URLs must match what it builds. -->
    <script>
      (function () {
        var chunks = /* ROUTE_CHUNKS */ {};
        var path = location.pathname.replace(/\/$/, "") || "/";
        (chunks[path] || chunks[path.replace(/[^/]+$/, "")] || []).forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "modulepreload";
          link.crossOrigin = "";
          link.href = href;
          document.head.appendChild(link);
        });
        var early = (window.__early = {});
        var get = function (u) {
          return (early[u] = fetch(u, { headers: { Accept: "application/json" }, credentials: "same-origin" }));
        };
        if (path.indexOf("/app") !== 0) return;
        var me = get("/api/v1/auth/me");
        // every /app screen's stars read the watchlist; the status code alone says signed in
        me.then(function (r) {
          if (r.ok) get("/api/v1/me/watchlist");
        });
        if ((path !== "/app" && path !== "/app/market") || /[?&]start=/.test(location.search)) return;
        var status = get("/api/v1/market/status");
        // likewise the snapshot starts before the app reads the session's body
        var signedIn = me.then(function (r) {
          if (r.ok) {
            get("/api/v1/market/snapshot");
            get("/api/v1/market/history?days=20");
          }
          return r.ok;
        });
        Promise.all([
          signedIn,
          status.then(function (r) {
            return r.ok ? r.clone().json() : null;
          }),
        ])
          .then(function (b) {
            if (!b[0] || !b[1] || !b[1].latest_trade_date) return;
            var d = new Date(b[1].latest_trade_date + "T00:00:00Z");
            d.setUTCDate(d.getUTCDate() - 1); // the API steps back over weekends and holidays
            get("/api/v1/market/snapshot?date=" + d.toISOString().slice(0, 10));
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <!-- Painted before the app's JavaScript arrives, then replaced on mount (P3 criterion 3) -->
    <div id="root">
      <div class="boot" aria-busy="true">
        <img src="/brand/mark-dark.svg" width="56" height="56" alt="" class="logo-on-dark" />
        <img src="/brand/mark-light.svg" width="56" height="56" alt="" class="logo-on-light" />
        <span class="sr-only">Loading EquityLensNG</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
