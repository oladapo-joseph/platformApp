[project]
name = "equitylens-api"
version = "0.1.0"
description = "EquityLensNG API: NGX market data, technical analysis and news (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.11",
    "pymongo>=4.17,<5",
    "pandas>=3.0,<4",
    "numpy>=2.4,<3",
    "cachetools>=7.0",
    "pwdlib[argon2]>=0.2",
    "httpx>=0.28",
    "email-validator>=2.2",
    "anthropic>=1.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=2.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pymongo-inmemory>=0.5",
    "ruff>=0.14",
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "types-cachetools>=6.2",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",                        # FastAPI Depends()/Query() in defaults
    "RUF001", "RUF002", "RUF003",  # typographic – × → in user-facing text and docs
]

[tool.ruff.lint.per-file-ignores]
"app/emails/layout.py" = ["E501"]  # the email HTML skeleton reads best one tag per line

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymongo_inmemory.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
